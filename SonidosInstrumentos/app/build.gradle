plugins {
    id 'com.android.application'
}

// Nombre del autor que muestra la app. Se puede cambiar en local.properties: alumno.nombre=Otro Nombre
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withReader('UTF-8') { localProps.load(it) }
}
def alumno = localProps.getProperty('alumno.nombre', 'Ezequiel Olivera Reyes')

android {
    namespace 'com.example.sonidos'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.sonidos"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "ALUMNO", "\"${alumno}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
